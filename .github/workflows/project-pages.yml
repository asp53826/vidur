name: Publish project page
on:
  push:
    branches: [spec-decode]
    paths:
      - "docs/project/**"
      - "docs/assets/spec_decode_sweep/results.csv"
      - "scripts/export_project_results.py"
      - ".github/workflows/project-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'asp53826/vidur'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check that the page uses the recorded results
        run: python3 scripts/export_project_results.py --check
      - name: Check JavaScript syntax
        run: node --check docs/project/app.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/project
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
