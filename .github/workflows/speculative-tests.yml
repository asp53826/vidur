name: Speculative decoding tests
on:
  push:
    branches: [spec-decode]
  pull_request:
    branches: [spec-decode]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiohttp
      - run: python -m pytest tests validation/tests -q
      - run: python scripts/export_project_results.py --check
